    function drawFrameOnCanvas(canvas, style, imgEl, userName) {
      const ctx = canvas.getContext("2d");
      const W = 600, H = 600;
      canvas.width = W; canvas.height = H;

      ctx.fillStyle = style.bg;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = 0.05;
      for (let x = 0; x < W; x += 30)
        for (let y = 0; y < H; y += 30) { ctx.fillStyle = style.accent; ctx.fillRect(x, y, 14, 14); }
      ctx.restore();

      const PAD = 72, TB = 72, BB = 72;
      const px = PAD, py = TB, pw = W - PAD * 2, ph = H - TB - BB;

      if (imgEl) {
        ctx.save();
        ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
        const ir = imgEl.naturalWidth / imgEl.naturalHeight, br = pw / ph;
        let sx, sy, sw, sh;
        if (ir > br) { sh = imgEl.naturalHeight; sw = sh * br; sx = (imgEl.naturalWidth - sw) / 2; sy = 0; }
        else { sw = imgEl.naturalWidth; sh = sw / br; sx = 0; sy = (imgEl.naturalHeight - sh) / 2; }
        ctx.drawImage(imgEl, sx, sy, sw, sh, px, py, pw, ph);
        ctx.restore();
        const g = ctx.createRadialGradient(W/2, H/2, pw*0.25, W/2, H/2, pw*0.7);
        g.addColorStop(0, "transparent"); g.addColorStop(1, style.bg + "88");
        ctx.fillStyle = g; ctx.fillRect(px, py, pw, ph);
      } else {
        ctx.fillStyle = style.band + "44"; ctx.fillRect(px, py, pw, ph);
        ctx.fillStyle = style.accent + "88";
        ctx.font = "bold 18px Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("📷  Importez votre photo", W / 2, H / 2);
      }

      ctx.fillStyle = style.band; ctx.fillRect(0, 0, W, TB);
      ctx.fillStyle = style.accent + "44";
      for (let x = 0; x < W; x += 20) ctx.fillRect(x, 0, 10, TB);
      ctx.fillStyle = style.border; ctx.fillRect(0, TB - 4, W, 4);

      ctx.fillStyle = style.band; ctx.fillRect(0, H - BB, W, BB);
      ctx.fillStyle = style.border; ctx.fillRect(0, H - BB, W, 4);

      ctx.fillStyle = style.accent; ctx.fillRect(0, 6, W, 3); ctx.fillRect(0, H - 9, W, 3);

      ctx.strokeStyle = style.accent; ctx.lineWidth = 3; ctx.strokeRect(10, 10, W - 20, H - 20);
      ctx.strokeStyle = style.border; ctx.lineWidth = 1.5; ctx.strokeRect(18, 18, W - 36, H - 36);

      ctx.fillStyle = style.accent; ctx.font = "bold 32px Georgia, serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("✦  J'Y SERAI  ✦", W / 2, 36);

      if (userName && userName.trim()) {
        ctx.fillStyle = style.text; ctx.font = "italic 20px Georgia, serif";
        ctx.textAlign = "center"; ctx.textBaseline = "top";
        ctx.fillText(userName.trim(), W / 2, TB + 10);
      }

      ctx.fillStyle = style.text; ctx.font = "bold 14px Georgia, serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("LA RENCONTRE DES ENFANTS ADJOBO", W / 2, H - 44);
      ctx.fillStyle = style.accent; ctx.font = "12px Georgia, serif";
      ctx.fillText("24 – 26 JUILLET 2026  •  KILIBO, BÉNIN", W / 2, H - 22);

      [[22,22],[W-22,22],[22,H-22],[W-22,H-22]].forEach(([cx,cy]) => {
        ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI*2); ctx.fillStyle = style.accent; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI*2); ctx.strokeStyle = style.border; ctx.lineWidth = 1; ctx.stroke();
      });
    }

        };
        tick(); const id = setInterval(tick, 1000); return () => clearInterval(id);
      }, []);

      const redraw = useCallback(() => {
        if (!canvasRef.current) return;
        drawFrameOnCanvas(canvasRef.current, FRAME_STYLES[frameIdx], imgRef.current, userName);
      }, [frameIdx, userName]);

      useEffect(() => { redraw(); }, [redraw]);

      useEffect(() => {
        if (!userPhoto) { imgRef.current = null; redraw(); return; }

        img.onload = () => { imgRef.current = img; redraw(); };
        img.src = userPhoto;

            <div style={{ position: "absolute", inset: 0, background: "radial-gradient(ellipse at 50% 30%,rgba(255,255,255,0.12) 0%,transparent 60%)" }} />
            <div style={{ position: "relative", zIndex: 1, maxWidth: 820 }}>

              <h1 style={{ fontFamily: "'Cormorant Garamond',Georgia,serif", fontSize: "clamp(38px,6.5vw,76px)", color: WHITE, lineHeight: 1.08, marginBottom: 18, fontWeight: 700, textShadow: "0 2px 20px rgba(0,0,0,0.18)" }}>
