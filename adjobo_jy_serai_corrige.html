<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADJOBO 2026 - J'Y SERAI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#FFF8E7 0%,#FFE8B3 100%);
      min-height:100vh;
      padding:40px 20px;
    }

    #jyserai{
      background:linear-gradient(160deg,#FEF0CC,#FDDEA0,#FEF0CC);
      padding:88px 24px;
      border-radius:32px;
      max-width:1000px;
      margin:auto;
    }

    .container{
      max-width:820px;
      margin:0 auto;
      text-align:center;
    }

    h1{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(32px,5vw,58px);
      color:#5C2800;
      margin-bottom:12px;
      font-weight:700;
    }

    .line{
      width:70px;
      height:4px;
      background:#C8780A;
      margin:0 auto 22px;
      border-radius:50px;
    }

    .desc{
      color:#7A4018;
      font-size:16px;
      line-height:1.7;
      margin-bottom:40px;
    }

    canvas{
      width:100%;
      max-width:390px;
      border-radius:26px;
      background:#fff;
      box-shadow:0 25px 60px rgba(0,0,0,.18);
    }

    .input{
      width:100%;
      max-width:420px;
      margin-top:30px;
      border:2px solid #C8780A;
      border-radius:50px;
      padding:16px 24px;
      font-size:16px;
      font-weight:600;
      outline:none;
    }

    .buttons{
      margin-top:26px;
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      cursor:pointer;
      padding:14px 28px;
      border-radius:50px;
      font-size:15px;
      font-weight:700;
      transition:.25s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    .upload{
      background:#fff;
      color:#C8780A;
      border:2px solid #C8780A;
    }

    .download{
      background:linear-gradient(135deg,#F5A623,#D4891A);
      color:#fff;
    }

    .whatsapp{
      background:#25D366;
      color:#fff;
    }

    input[type="file"]{
      display:none;
    }

  </style>
</head>

<body>

<section id="jyserai">

  <div class="container">

    <h1>
      Affiche fièrement ta participation !
    </h1>

    <div class="line"></div>

    <p class="desc">
      Importe ta photo, ajoute ton nom et partage
      pour montrer que tu seras présent(e) 🎉
    </p>

    <canvas id="canvas"></canvas>

    <br>

    <input
      type="text"
      id="username"
      class="input"
      placeholder="Ton nom et prénom"
    />

    <div class="buttons">

      <input
        type="file"
        id="fileInput"
        accept="image/*"
      />

      <button
        class="upload"
        onclick="document.getElementById('fileInput').click()"
      >
        📸 Importer ma photo
      </button>

      <button
        class="download"
        onclick="downloadImage()"
      >
        ⬇️ Télécharger
      </button>

      <button
        class="whatsapp"
        onclick="shareWhatsApp()"
      >
        📲 Partager WhatsApp
      </button>

    </div>

  </div>

</section>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 900;
const H = 1050;

canvas.width = W;
canvas.height = H;

let uploadedImage = null;

function roundRect(ctx,x,y,width,height,radius){

  ctx.beginPath();

  ctx.moveTo(x + radius, y);

  ctx.lineTo(x + width - radius, y);

  ctx.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + radius
  );

  ctx.lineTo(
    x + width,
    y + height - radius
  );

  ctx.quadraticCurveTo(
    x + width,
    y + height,
    x + width - radius,
    y + height
  );

  ctx.lineTo(
    x + radius,
    y + height
  );

  ctx.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - radius
  );

  ctx.lineTo(x, y + radius);

  ctx.quadraticCurveTo(
    x,
    y,
    x + radius,
    y
  );

  ctx.closePath();
}

function drawCanvas(){

  ctx.clearRect(0,0,W,H);

  ctx.fillStyle = "#F5F5F5";
  ctx.fillRect(0,0,W,H);

  // CARTE BLANCHE
  ctx.shadowColor = "rgba(0,0,0,.15)";
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 8;

  ctx.fillStyle = "#FFFFFF";

  roundRect(
    ctx,
    70,
    40,
    760,
    920,
    28
  );

  ctx.fill();

  ctx.shadowColor = "transparent";

  // PHOTO
  if(uploadedImage){

    const photoX = 120;
    const photoY = 90;

    const photoW = 660;
    const photoH = 560;

    const hRatio =
      photoW / uploadedImage.width;

    const vRatio =
      photoH / uploadedImage.height;

    const ratio =
      Math.max(hRatio,vRatio);

    const newWidth =
      uploadedImage.width * ratio;

    const newHeight =
      uploadedImage.height * ratio;

    const centerShiftX =
      (photoW - newWidth) / 2;

    const centerShiftY =
      (photoH - newHeight) / 2;

    ctx.save();

    roundRect(
      ctx,
      photoX,
      photoY,
      photoW,
      photoH,
      22
    );

    ctx.clip();

    ctx.drawImage(
      uploadedImage,
      photoX + centerShiftX,
      photoY + centerShiftY,
      newWidth,
      newHeight
    );

    ctx.restore();
  }

  // J'Y SERAI
  ctx.font =
    "900 72px Poppins";

  ctx.textAlign = "center";

  const jyGradient =
    ctx.createLinearGradient(
      0,
      680,
      0,
      820
    );

  jyGradient.addColorStop(
    0,
    "#4A2200"
  );

  jyGradient.addColorStop(
    1,
    "#F5A623"
  );

  ctx.fillStyle = jyGradient;

  ctx.fillText(
    "J'Y SERAI !",
    450,
    760
  );

  // TITRE
  ctx.fillStyle = "#4A2200";

  ctx.font =
    "bold 30px Poppins";

  ctx.fillText(
    "LA RENCONTRE DES ENFANTS ADJOBO",
    450,
    840
  );

  // LIGNE
  ctx.fillStyle = "#F5A623";

  roundRect(
    ctx,
    250,
    870,
    400,
    5,
    20
  );

  ctx.fill();

  // DATE
  ctx.font =
    "600 22px Poppins";

  ctx.fillStyle = "#6B4A2A";

  ctx.fillText(
    "24 - 26 JUILLET 2026 • KILIBO, BÉNIN",
    450,
    920
  );

  // NOM
  const username =
    document
      .getElementById("username")
      .value
      .trim();

  if(username){

    ctx.shadowColor =
      "rgba(0,0,0,.20)";

    ctx.shadowBlur = 18;

    const gradient =
      ctx.createLinearGradient(
        180,
        0,
        720,
        0
      );

    gradient.addColorStop(
      0,
      "#F5A623"
    );

    gradient.addColorStop(
      1,
      "#D4891A"
    );

    ctx.fillStyle = gradient;

    roundRect(
      ctx,
      180,
      960,
      540,
      78,
      22
    );

    ctx.fill();

    ctx.shadowColor =
      "transparent";

    ctx.fillStyle = "#FFFFFF";

    ctx.font =
      "bold 40px Poppins";

    ctx.fillText(
      username.toUpperCase(),
      450,
      1012
    );
  }
}

document
  .getElementById("username")
  .addEventListener(
    "input",
    drawCanvas
  );

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function(e){

      const file =
        e.target.files[0];

      if(!file) return;

      const reader =
        new FileReader();

      reader.onload =
        function(event){

          const img =
            new Image();

          img.onload =
            function(){

              uploadedImage = img;

              drawCanvas();
            };

          img.src =
            event.target.result;
        };

      reader.readAsDataURL(file);
});

function downloadImage(){

  const username =
    document
      .getElementById("username")
      .value
      .trim() || "ADJOBO";

  const link =
    document.createElement("a");

  link.download =
    `ADJOBO_${username}.png`;

  link.href =
    canvas.toDataURL(
      "image/png",
      1
    );

  link.click();
}

function shareWhatsApp(){

  const text =
    "Je participe à La Rencontre des Enfants ADJOBO ! 🎉 Du 24 au 26 juillet 2026 à Kilibo, Bénin.";

  window.open(
    "https://wa.me/?text=" +
    encodeURIComponent(text),
    "_blank"
  );
}

drawCanvas();

</script>

</body>
</html>
